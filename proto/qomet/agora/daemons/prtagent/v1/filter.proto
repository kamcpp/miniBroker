syntax = "proto3";

// Field Numbering Convention:
// 1-100: Core business fields
// 101-104: Display metadata (display_name, description, labels, tags)
// 105: Request aux_data / Response metadata
// 106-999: Reserved for future use
// 1000+: Extension/OTHER enum values

package qomet.agora.daemons.prtagent.v1;

option go_package = "pkg/daemons/prtagent/api/v1/grpc;prtagentapiv1";
option csharp_namespace  = "Qomet.Agora.Daemons.ParticipantAgent.API.V1";

import "common.proto";
import "fin_common.proto";

message OrderQueryFilter {
  DateTime from_dt = 1;                       // OPTIONAL: Start of time range
  DateTime to_dt = 2;                         // OPTIONAL: End of time range
  OrderSide side = 3;                         // OPTIONAL: Filter by order side
  repeated string order_types = 4;            // OPTIONAL: Filter by order types
  string price_min = 5;                       // OPTIONAL: Minimum price filter
  string price_max = 6;                       // OPTIONAL: Maximum price filter
  string quantity_min = 7;                    // OPTIONAL: Minimum quantity filter
  string quantity_max = 8;                    // OPTIONAL: Maximum quantity filter
  repeated bool status_filters = 9;           // OPTIONAL: Status filters [is_filled, is_cancelled, is_expired]
  string creator_address = 10;                // OPTIONAL: Filter by creator address
}

message TradeQueryFilter {
  DateTime from_dt = 1;                       // OPTIONAL: Start of time range
  DateTime to_dt = 2;                         // OPTIONAL: End of time range
  string price_min = 3;                       // OPTIONAL: Minimum price filter
  string price_max = 4;                       // OPTIONAL: Maximum price filter
  string volume_min = 5;                      // OPTIONAL: Minimum volume filter
  string volume_max = 6;                      // OPTIONAL: Maximum volume filter
  repeated string trade_types = 7;            // OPTIONAL: Filter by trade types
  OrderSide side = 8;                         // OPTIONAL: Filter by order side
}

message SettlementQueryFilter {
  DateTime from_dt = 1;                       // OPTIONAL: Start of time range
  DateTime to_dt = 2;                         // OPTIONAL: End of time range
  ConfirmationStatus status = 3;              // OPTIONAL: Filter by confirmation status
  repeated string settlement_types = 4;       // OPTIONAL: Filter by settlement types
  repeated string asset_id_or_name_regexes = 5; // OPTIONAL: Filter by asset ID or name regex
  string amount_min = 6;                      // OPTIONAL: Minimum amount filter
  string amount_max = 7;                      // OPTIONAL: Maximum amount filter
}

message OrderbookQueryFilter {
  bool aggregated = 1;                        // OPTIONAL: Whether to aggregate orders (default: false)
  OrderSide side = 2;                         // OPTIONAL: Filter by order side
  uint32 depth = 3;                           // OPTIONAL: Order book depth limit
  string price_min = 4;                       // OPTIONAL: Minimum price filter
  string price_max = 5;                       // OPTIONAL: Maximum price filter
  bool include_my_orders = 6;                 // OPTIONAL: Include own orders (default: false)
  string group_by_price_increment = 7;        // OPTIONAL: Price increment for grouping
}

message OrderList {
  PaginationInfo pagination_info = 1;         // OPTIONAL: Pagination information
  repeated Order orders = 2;                  // REQUIRED: List of orders (can be empty)
}