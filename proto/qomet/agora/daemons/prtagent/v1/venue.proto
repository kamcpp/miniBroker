syntax = "proto3";

// Field Numbering Convention:
// 1-100: Core business fields
// 101-104: Display metadata (display_name, description, labels, tags)
// 105: Request aux_data / Response metadata
// 106-999: Reserved for future use
// 1000+: Extension/OTHER enum values

package qomet.agora.daemons.prtagent.v1;

option go_package = "pkg/daemons/prtagent/api/v1/grpc;prtagentapiv1";
option csharp_namespace  = "Qomet.Agora.Daemons.ParticipantAgent.API.V1";

import "common.proto";
import "fin_common.proto";

service VenueService {
  rpc GetVenueList(GetVenueListRequest) returns (GetVenueListResponse);
  rpc GetVenueListAsync(GetVenueListRequest) returns (ExecutionAsyncResponse);

  rpc GetVenueCalendar(GetVenueCalendarRequest) returns (GetVenueCalendarResponse);
  rpc GetVenueCalendarAsync(GetVenueCalendarRequest) returns (ExecutionAsyncResponse);
}

message GetVenueListRequest {
  string proposed_execution_id = 1;           // OPTIONAL: Client-proposed execution ID for tracking
  PaginationParams pagination = 2;            // OPTIONAL: Pagination parameters
  string market_id_or_symbol_regex = 3;       // OPTIONAL: Filter by market ID or symbol regex
  string venue_id_or_symbol_regex = 4;        // OPTIONAL: Filter by venue ID or symbol regex

  map<string, string> aux_data = 105;         // OPTIONAL: Additional request data
}

message GetVenueListResponse {
  string ref_execution_id = 1;                // REQUIRED: Reference to the execution ID
  PaginationInfo pagination = 2;              // OPTIONAL: Pagination information (required if paginated)
  repeated Venue venues = 3;                  // REQUIRED: List of venues (can be empty)

  map<string, string> metadata = 105;         // OPTIONAL: Response metadata
}

message GetVenueCalendarRequest {
  string proposed_execution_id = 1;           // OPTIONAL: Client-proposed execution ID for tracking
  string venue_iid = 2;                       // REQUIRED: Venue internal ID to get calendar for

  map<string, string> aux_data = 105;         // OPTIONAL: Additional request data
}

message GetVenueCalendarResponse {
  string ref_execution_id = 1;                // REQUIRED: Reference to the execution ID
  VenueCalendar calendar = 2;                 // REQUIRED: Venue calendar information

  map<string, string> metadata = 105;         // OPTIONAL: Response metadata
}