syntax = "proto3";

// Field Numbering Convention:
// 1-100: Core business fields
// 101-104: Display metadata (display_name, description, labels, tags)
// 105: Request aux_data / Response metadata
// 106-999: Reserved for future use
// 1000+: Extension/OTHER enum values

package qomet.agora.daemons.prtagent.v1;

option go_package = "pkg/daemons/prtagent/api/v1/grpc;prtagentapiv1";
option csharp_namespace  = "Qomet.Agora.Daemons.ParticipantAgent.API.V1";

import "common.proto";
import "fin_common.proto";
import "filter.proto";

service InstrumentService {
  rpc GetInstrumentList(GetInstrumentListRequest) returns (GetInstrumentListResponse);
  rpc GetInstrumentListAsync(GetInstrumentListRequest) returns (ExecutionAsyncResponse);

  rpc GetInstrumentInfoBatch(GetInstrumentInfoBatchRequest) returns (GetInstrumentInfoBatchResponse);
  rpc GetInstrumentInfoBatchAsync(GetInstrumentInfoBatchRequest) returns (ExecutionAsyncResponse);

  rpc GetInstrumentOrders(GetInstrumentOrdersRequest) returns (GetInstrumentOrdersResponse);
  rpc GetInstrumentOrdersAsync(GetInstrumentOrdersRequest) returns (ExecutionAsyncResponse);

  rpc GetInstrumentTrades(GetInstrumentTradesRequest) returns (GetInstrumentTradesResponse);
  rpc GetInstrumentTradesAsync(GetInstrumentTradesRequest) returns (ExecutionAsyncResponse);

  rpc GetInstrumentSettlements(GetInstrumentSettlementsRequest) returns (GetInstrumentSettlementsResponse);
  rpc GetInstrumentSettlementsAsync(GetInstrumentSettlementsRequest) returns (ExecutionAsyncResponse);
}

message GetInstrumentListRequest {
  string proposed_execution_id = 1;           // OPTIONAL: Client-proposed execution ID for tracking
  PaginationParams pagination = 2;            // OPTIONAL: Pagination parameters
  string market_id_or_symbol_regex = 3;       // OPTIONAL: Filter by market ID or symbol regex
  string venue_id_or_symbol_regex = 4;        // OPTIONAL: Filter by venue ID or symbol regex
  string instrument_id_or_symbol_regex = 5;   // OPTIONAL: Filter by instrument ID or symbol regex
  repeated InstrumentListingStatusEnum listing_types = 6; // OPTIONAL: Filter by listing status types

  map<string, string> aux_data = 105;         // OPTIONAL: Additional request data
}

message GetInstrumentListResponse {
  string ref_execution_id = 1;                // REQUIRED: Reference to the execution ID
  PaginationInfo pagination_info = 2;         // OPTIONAL: Pagination information (required if paginated)
  repeated Instrument instruments = 3;         // REQUIRED: List of instruments (can be empty)

  map<string, string> metadata = 105;         // OPTIONAL: Response metadata
}

message GetInstrumentInfoBatchRequest {
  string proposed_execution_id = 1;           // OPTIONAL: Client-proposed execution ID for tracking
  PaginationParams pagination = 2;            // OPTIONAL: Pagination parameters
  repeated string instrument_id_and_symbol_regexes = 3; // REQUIRED: Instrument ID and symbol regexes to retrieve
  repeated InstrumentListingStatusEnum listing_types = 4; // OPTIONAL: Filter by listing status types

  map<string, string> aux_data = 105;         // OPTIONAL: Additional request data
}

message GetInstrumentInfoBatchResponse {
  string ref_execution_id = 1;                // REQUIRED: Reference to the execution ID
  PaginationInfo pagination_info = 3;         // OPTIONAL: Pagination information (required if paginated)
  repeated Instrument instruments = 4;         // REQUIRED: List of instrument details (can be empty)

  map<string, string> metadata = 105;         // OPTIONAL: Response metadata
}

message GetInstrumentOrdersRequest {
  string proposed_execution_id = 1;           // OPTIONAL: Client-proposed execution ID for tracking
  PaginationParams pagination = 2;            // OPTIONAL: Pagination parameters
  repeated string instrument_id_and_symbol_regexes = 3; // REQUIRED: Instrument ID and symbol regexes
  OrderQueryFilter order_query_filter = 4;    // OPTIONAL: Additional order filters

  map<string, string> aux_data = 105;         // OPTIONAL: Additional request data
}

message GetInstrumentOrdersResponse {
  string ref_execution_id = 1;                // REQUIRED: Reference to the execution ID
  PaginationInfo pagination_info = 2;         // OPTIONAL: Pagination information (required if paginated)
  repeated Order orders = 3;                  // REQUIRED: List of orders (can be empty)

  map<string, string> metadata = 105;         // OPTIONAL: Response metadata
}

message GetInstrumentTradesRequest {
  string proposed_execution_id = 1;           // OPTIONAL: Client-proposed execution ID for tracking
  PaginationParams pagination = 2;            // OPTIONAL: Pagination parameters
  repeated string instrument_id_and_symbol_regexes = 3; // REQUIRED: Instrument ID and symbol regexes
  TradeQueryFilter trade_query_filter = 4;    // OPTIONAL: Additional trade filters

  map<string, string> aux_data = 105;         // OPTIONAL: Additional request data
}

message GetInstrumentTradesResponse {
  string ref_execution_id = 1;                // REQUIRED: Reference to the execution ID
  PaginationInfo pagination_info = 2;         // OPTIONAL: Pagination information (required if paginated)
  repeated Trade trades = 3;                  // REQUIRED: List of trades (can be empty)

  map<string, string> metadata = 105;         // OPTIONAL: Response metadata
}

message GetInstrumentSettlementsRequest {
  string proposed_execution_id = 1;           // OPTIONAL: Client-proposed execution ID for tracking
  PaginationParams pagination = 2;            // OPTIONAL: Pagination parameters
  repeated string instrument_id_and_symbol_regexes = 3; // REQUIRED: Instrument ID and symbol regexes
  SettlementQueryFilter settlement_query_filter = 4; // OPTIONAL: Additional settlement filters

  map<string, string> aux_data = 105;         // OPTIONAL: Additional request data
}

message GetInstrumentSettlementsResponse {
  string ref_execution_id = 1;                // REQUIRED: Reference to the execution ID
  PaginationInfo pagination_info = 2;         // OPTIONAL: Pagination information (required if paginated)
  repeated Settlement settlements = 3;         // REQUIRED: List of settlements (can be empty)

  map<string, string> metadata = 105;         // OPTIONAL: Response metadata
}
