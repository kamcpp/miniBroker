syntax = "proto3";

package tech.qomet.agora.api.grpc.prtagent.v1;

import "common.proto";
import "fin/market.proto";

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/prtagent/v1;agoraapigrpcprtagentv1";
option java_package = "tech.qomet.agora.api.grpc.prtagent.v1";
option java_outer_classname = "MarketPrt";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.PrtAgent.V1";

service MarketService {
  rpc GetMarketList(GetMarketListRequest) returns (GetMarketListResponse);
  rpc GetMarketListAsync(GetMarketListRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);
}

message GetMarketListRequest {
  string proposed_execution_id = 1;                                                        // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;                        // OPTIONAL: Pagination parameters
  string market_iid = 3;                                                                   // OPTIONAL: Filter by market IID

  map<string, string> aux_data = 105;                                                      // OPTIONAL: Additional request data
}

message GetMarketListResponse {
  string ref_execution_id = 1;                                                             // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;                     // OPTIONAL: Pagination information (required if paginated)
  repeated tech.qomet.agora.api.grpc.fin.Market markets = 3;                               // REQUIRED: List of markets (can be empty)

  map<string, string> metadata = 105;                                                      // OPTIONAL: Response metadata
}
