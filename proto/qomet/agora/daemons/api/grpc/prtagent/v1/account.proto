syntax = "proto3";

package tech.qomet.agora.api.grpc.prtagent.v1;

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/prtagent/v1;agoraapigrpcprtagentv1";
option java_package = "tech.qomet.agora.api.grpc.prtagent.v1";
option java_outer_classname = "Account";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.PrtAgent.V1";

import "common.proto";
import "fin.proto";
import "prtagent/v1/query.proto";

service AccountService {
  rpc GetAccountList(GetAccountListRequest) returns (GetAccountListResponse);
  rpc GetAccountListAsync(GetAccountListRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc GetAccountInfoBatch(GetAccountInfoBatchRequest) returns (GetAccountInfoBatchResponse);
  rpc GetAccountInfoBatchAsync(GetAccountInfoBatchRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc NewAccount(NewAccountRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);
  rpc ActivateVenueForAccount(ActivateVenueForAccountRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc DepositCash(DepositCashRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);
  rpc DepositInstrument(DepositInstrumentRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);
  rpc WithdrawCash(WithdrawCashRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);
  rpc WithdrawInstrument(WithdrawInstrumentRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc GetAccountInstrumentHoldings(GetAccountInstrumentHoldingsRequest) returns (GetAccountInstrumentHoldingsResponse);
  rpc GetAccountInstrumentHoldingsAsync(GetAccountInstrumentHoldingsRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc GetAccountCashHoldings(GetAccountCashHoldingsRequest) returns (GetAccountCashHoldingsResponse);
  rpc GetAccountCashHoldingsAsync(GetAccountCashHoldingsRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc GetAccountOrders(GetAccountOrdersRequest) returns (GetAccountOrdersResponse);
  rpc GetAccountOrdersAsync(GetAccountOrdersRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc GetAccountTrades(GetAccountTradesRequest) returns (GetAccountTradesResponse);
  rpc GetAccountTradesAsync(GetAccountTradesRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc GetAccountSettlements(GetAccountSettlementsRequest) returns (GetAccountSettlementsResponse);
  rpc GetAccountSettlementsAsync(GetAccountSettlementsRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc GetAccountTransactions(GetAccountTransactionsRequest) returns (GetAccountTransactionsResponse);
  rpc GetAccountTransactionsAsync(GetAccountTransactionsRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);
}

message GetAccountListRequest {
  string proposed_execution_id = 1;                      // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;    // OPTIONAL: Pagination parameters
  string account_iid_or_external_id_regex = 3;           // OPTIONAL: Filter by account ID regex

  map<string, string> aux_data = 105;                    // OPTIONAL: Additional request data
}

message GetAccountListResponse {
  string ref_execution_id = 1;                             // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;   // OPTIONAL: Pagination information (required if paginated)
  repeated tech.qomet.agora.api.grpc.common.Account accounts = 3;        // REQUIRED: List of accounts (can be empty)

  map<string, string> metadata = 105;                      // OPTIONAL: Response metadata
}

message GetAccountInfoBatchRequest {
  string proposed_execution_id = 1;               // OPTIONAL: Client-proposed execution ID for tracking
  repeated string account_iids = 2;               // REQUIRED: List of account IIDs to retrieve

  map<string, string> aux_data = 105;             // OPTIONAL: Additional request data
}

message GetAccountInfoBatchResponse {
  string ref_execution_id = 1;                        // REQUIRED: Reference to the execution ID
  repeated tech.qomet.agora.api.grpc.common.Account accounts = 2;   // REQUIRED: List of account details (can be empty)

  map<string, string> metadata = 105;                 // OPTIONAL: Response metadata
}

message NewAccountRequest {
  string proposed_execution_id = 1;               // OPTIONAL: Client-proposed execution ID for tracking
  string external_account_id = 2;                 // REQUIRED: External account identifier

  map<string, string> aux_data = 105;             // OPTIONAL: Additional request data
}

message NewAccountResponse {
  string ref_execution_id = 1;                      // REQUIRED: Reference to the execution ID

  string agent_account_id = 2;                      // REQUIRED: Created agent account ID
  tech.qomet.agora.api.grpc.common.DateTime activation_dt = 3;    // REQUIRED: Account activation timestamp

  map<string, string> metadata = 105;               // OPTIONAL: Response metadata
}

message ActivateVenueForAccountRequest {
  string proposed_execution_id = 1;               // OPTIONAL: Client-proposed execution ID for tracking
  string account_iid = 2;                         // REQUIRED: Account internal ID
  string venue_iid = 3;                           // REQUIRED: Venue internal ID to activate

  map<string, string> aux_data = 105;             // OPTIONAL: Additional request data
}

message ActivateVenueForAccountResponse {
  string ref_execution_id = 1;                     // REQUIRED: Reference to the execution ID

  tech.qomet.agora.api.grpc.common.DateTime activation_dt = 2;   // REQUIRED: Venue activation timestamp

  map<string, string> metadata = 105;              // OPTIONAL: Response metadata
}

message GetAccountInstrumentHoldingsRequest {
  string proposed_execution_id = 1;               // OPTIONAL: Client-proposed execution ID for tracking
  string account_iid = 2;                         // REQUIRED: Account internal ID
  string venue_iid = 3;                           // OPTIONAL: Venue internal ID (filter by venue)
  repeated string instrument_iids = 4;            // OPTIONAL: Specific instrument IIDs to retrieve

  map<string, string> aux_data = 105;             // OPTIONAL: Additional request data
}

message GetAccountInstrumentHoldingsResponse {
  string ref_execution_id = 1;                    // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.Portfolio portfolio = 2;     // REQUIRED: Portfolio with instrument holdings

  map<string, string> metadata = 105;             // OPTIONAL: Response metadata
}

message GetAccountCashHoldingsRequest {
  string proposed_execution_id = 1;               // OPTIONAL: Client-proposed execution ID for tracking
  string account_iid = 2;                         // REQUIRED: Account internal ID
  repeated string currency_codes = 3;             // OPTIONAL: Specific currency codes to retrieve

  map<string, string> aux_data = 105;             // OPTIONAL: Additional request data
}

message GetAccountCashHoldingsResponse {
  string ref_execution_id = 1;                       // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.Portfolio cash_portfolio = 2;   // REQUIRED: Portfolio with cash holdings

  map<string, string> metadata = 105;                // OPTIONAL: Response metadata
}

message DepositCashRequest {
  string proposed_execution_id = 1;               // OPTIONAL: Client-proposed execution ID for tracking
  string account_iid = 2;                         // REQUIRED: Account internal ID
  string currency_code = 3;                       // REQUIRED: Currency code (e.g., "USD", "EUR")
  string amount = 4;                              // REQUIRED: Amount to deposit

  map<string, string> aux_data = 105;             // OPTIONAL: Additional request data
}

message DepositCashResponse {
  string ref_execution_id = 1;                    // REQUIRED: Reference to the execution ID

  map<string, string> metadata = 105;             // OPTIONAL: Response metadata
}

message DepositInstrumentRequest {
  string proposed_execution_id = 1;               // OPTIONAL: Client-proposed execution ID for tracking
  string account_iid = 2;                         // REQUIRED: Account internal ID
  string instrument_iid = 3;                      // REQUIRED: Instrument internal ID
  string units = 4;                               // REQUIRED: Number of units to deposit

  map<string, string> aux_data = 105;             // OPTIONAL: Additional request data
}

message DepositInstrumentResponse {
  string ref_execution_id = 1;                    // REQUIRED: Reference to the execution ID

  map<string, string> metadata = 105;             // OPTIONAL: Response metadata
}

message WithdrawCashRequest {
  string proposed_execution_id = 1;               // OPTIONAL: Client-proposed execution ID for tracking
  string account_iid = 2;                         // REQUIRED: Account internal ID
  string currency_code = 3;                       // REQUIRED: Currency code (e.g., "USD", "EUR")
  string amount = 4;                              // REQUIRED: Amount to withdraw

  map<string, string> aux_data = 105;             // OPTIONAL: Additional request data
}

message WithdrawCashResponse {
  string ref_execution_id = 1;                    // REQUIRED: Reference to the execution ID

  map<string, string> metadata = 105;             // OPTIONAL: Response metadata
}

message WithdrawInstrumentRequest {
  string proposed_execution_id = 1;               // OPTIONAL: Client-proposed execution ID for tracking
  string account_iid = 2;                         // REQUIRED: Account internal ID
  string instrument_iid = 3;                      // REQUIRED: Instrument internal ID
  string units = 4;                               // REQUIRED: Number of units to withdraw

  map<string, string> aux_data = 105;             // OPTIONAL: Additional request data
}

message WithdrawInstrumentResponse {
  string ref_execution_id = 1;                    // REQUIRED: Reference to the execution ID

  map<string, string> metadata = 105;             // OPTIONAL: Response metadata
}

message GetAccountOrdersRequest {
  string proposed_execution_id = 1;                      // OPTIONAL: Client-proposed execution ID for tracking
  string account_iid = 2;                                // REQUIRED: Account internal ID
  repeated string venue_id_or_symbol_regexes = 3;        // OPTIONAL: Filter by venue ID or symbol regex
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 4;    // OPTIONAL: Pagination parameters
  OrderQueryFilter order_query_filter = 5;               // OPTIONAL: Additional order filters

  map<string, string> aux_data = 105;                    // OPTIONAL: Additional request data
}

message GetAccountOrdersResponse {
  string ref_execution_id = 1;                               // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;     // OPTIONAL: Pagination information (required if paginated)
  tech.qomet.agora.api.grpc.common.DateTime generated_at_dt = 3;           // REQUIRED: Response generation timestamp
  repeated tech.qomet.agora.api.grpc.common.Order orders = 4;              // REQUIRED: List of orders (can be empty)

  map<string, string> metadata = 105;                        // OPTIONAL: Response metadata
}

message GetAccountTradesRequest {
  string proposed_execution_id = 1;                      // OPTIONAL: Client-proposed execution ID for tracking
  string account_iid = 2;                                // REQUIRED: Account internal ID
  repeated string market_id_or_name_regexes = 3;         // OPTIONAL: Filter by market ID or name regex
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 4;    // OPTIONAL: Pagination parameters
  tech.qomet.agora.api.grpc.common.DateTime from_dt = 5;               // OPTIONAL: Start of time range
  tech.qomet.agora.api.grpc.common.DateTime to_dt = 6;                 // OPTIONAL: End of time range
  repeated string instrument_id_or_symbol_regexes = 7;   // OPTIONAL: Filter by instrument ID or symbol regex
  tech.qomet.agora.api.grpc.common.OrderSide side = 8;                 // OPTIONAL: Filter by order side

  map<string, string> aux_data = 105;                    // OPTIONAL: Additional request data
}

message GetAccountTradesResponse {
  string ref_execution_id = 1;                              // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;    // OPTIONAL: Pagination information (required if paginated)
  tech.qomet.agora.api.grpc.common.DateTime generated_at_dt = 3;          // REQUIRED: Response generation timestamp
  repeated tech.qomet.agora.api.grpc.common.Trade trades = 4;             // REQUIRED: List of trades (can be empty)

  map<string, string> metadata = 105;                       // OPTIONAL: Response metadata
}

message GetAccountSettlementsRequest {
  string proposed_execution_id = 1;                        // OPTIONAL: Client-proposed execution ID for tracking
  string account_iid = 2;                                  // REQUIRED: Account internal ID
  repeated string market_id_or_name_regexes = 3;           // OPTIONAL: Filter by market ID or name regex
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 4;      // OPTIONAL: Pagination parameters
  tech.qomet.agora.api.grpc.common.DateTime from_dt = 5;                 // OPTIONAL: Start of time range
  tech.qomet.agora.api.grpc.common.DateTime to_dt = 6;                   // OPTIONAL: End of time range
  tech.qomet.agora.api.grpc.common.ConfirmationStatus status = 7;        // OPTIONAL: Filter by confirmation status
  repeated string asset_id_or_name_regexes = 8;            // OPTIONAL: Filter by asset ID or name regex

  map<string, string> aux_data = 105;                      // OPTIONAL: Additional request data
}

message GetAccountSettlementsResponse {
  string ref_execution_id = 1;                                 // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;       // OPTIONAL: Pagination information (required if paginated)
  tech.qomet.agora.api.grpc.common.DateTime generated_at_dt = 3;             // REQUIRED: Response generation timestamp
  repeated tech.qomet.agora.api.grpc.common.Settlement settlements = 4;      // REQUIRED: List of settlements (can be empty)

  map<string, string> metadata = 105;                          // OPTIONAL: Response metadata
}

message GetAccountTransactionsRequest {
  string proposed_execution_id = 1;                                       // OPTIONAL: Client-proposed execution ID for tracking
  string account_iid = 2;                                                 // REQUIRED: Account internal ID
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 3;                     // OPTIONAL: Pagination parameters
  tech.qomet.agora.api.grpc.common.DateTime from_dt = 4;                                // OPTIONAL: Start of time range
  tech.qomet.agora.api.grpc.common.DateTime to_dt = 5;                                  // OPTIONAL: End of time range
  repeated tech.qomet.agora.api.grpc.common.TransactionTypeEnum transaction_types = 6;  // OPTIONAL: Filter by transaction types
  repeated string asset_id_or_name_regexes = 7;                           // OPTIONAL: Filter by asset ID or name regex

  map<string, string> aux_data = 105;                                     // OPTIONAL: Additional request data
}

message GetAccountTransactionsResponse {
  string ref_execution_id = 1;                                // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;      // OPTIONAL: Pagination information (required if paginated)
  tech.qomet.agora.api.grpc.common.DateTime generated_at_dt = 3;            // REQUIRED: Response generation timestamp
  repeated tech.qomet.agora.api.grpc.common.Transaction transactions = 4;   // REQUIRED: List of transactions (can be empty)

  map<string, string> metadata = 105;                         // OPTIONAL: Response metadata
}
