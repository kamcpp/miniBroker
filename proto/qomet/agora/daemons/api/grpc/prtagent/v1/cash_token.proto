syntax = "proto3";

package tech.qomet.agora.api.grpc.prtagent.v1;

import "common.proto";
import "fin/cash_token.proto";

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/prtagent/v1;agoraapigrpcprtagentv1";
option java_package = "tech.qomet.agora.api.grpc.prtagent.v1";
option java_outer_classname = "CashToken";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.PrtAgent.V1";

service CashTokenService {
  // Query operations
  rpc GetCashTokenList(GetCashTokenListRequest) returns (GetCashTokenListResponse);
  rpc GetCashTokenListAsync(GetCashTokenListRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc GetCashTokenInfoBatch(GetCashTokenInfoBatchRequest) returns (GetCashTokenInfoBatchResponse);
  rpc GetCashTokenInfoBatchAsync(GetCashTokenInfoBatchRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);
}

// ============================================================================
// Query Messages
// ============================================================================

message GetCashTokenListRequest {
  string proposed_execution_id = 1;                                                        // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;                        // OPTIONAL: Pagination parameters
  string cash_token_iid_or_identifier_regex = 3;                                           // OPTIONAL: Filter by cash token IID or identifier regex
  repeated string currency_codes = 4;                                                      // OPTIONAL: Filter by currency code (e.g., "USD", "EUR")
  repeated tech.qomet.agora.api.grpc.fin.CashTokenStatusEnum statuses = 5;                 // OPTIONAL: Filter by cash token status

  map<string, string> aux_data = 105;                                                      // OPTIONAL: Additional request data
}

message GetCashTokenListResponse {
  string ref_execution_id = 1;                                                             // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;                     // OPTIONAL: Pagination information (required if paginated)
  repeated tech.qomet.agora.api.grpc.fin.CashToken cash_tokens = 3;                        // REQUIRED: List of cash tokens (can be empty)

  map<string, string> metadata = 105;                                                      // OPTIONAL: Response metadata
}

message GetCashTokenInfoBatchRequest {
  string proposed_execution_id = 1;                                                        // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;                        // OPTIONAL: Pagination parameters
  repeated string cash_token_iids = 3;                                                     // REQUIRED: Cash token IIDs to retrieve
  repeated tech.qomet.agora.api.grpc.fin.CashTokenStatusEnum statuses = 4;                 // OPTIONAL: Filter by cash token status

  map<string, string> aux_data = 105;                                                      // OPTIONAL: Additional request data
}

message GetCashTokenInfoBatchResponse {
  string ref_execution_id = 1;                                                             // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;                     // OPTIONAL: Pagination information (required if paginated)
  repeated tech.qomet.agora.api.grpc.fin.CashToken cash_tokens = 3;                        // REQUIRED: List of cash token details (can be empty)

  map<string, string> metadata = 105;                                                      // OPTIONAL: Response metadata
}
