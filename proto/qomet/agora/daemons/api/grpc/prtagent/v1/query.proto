syntax = "proto3";

package tech.qomet.agora.api.grpc.prtagent.v1;

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/prtagent/v1;agoraapigrpcprtagentv1";
option java_package = "tech.qomet.agora.api.grpc.prtagent.v1";
option java_outer_classname = "Query";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.PrtAgent.V1";

import "common.proto";
import "fin.proto";

message OrderQueryFilter {
  tech.qomet.agora.api.grpc.common.DateTime from_dt = 1;    // OPTIONAL: Start of time range
  tech.qomet.agora.api.grpc.common.DateTime to_dt = 2;      // OPTIONAL: End of time range
  tech.qomet.agora.api.grpc.common.OrderSide side = 3;      // OPTIONAL: Filter by order side
  repeated string order_types = 4;            // OPTIONAL: Filter by order types
  string price_min = 5;                       // OPTIONAL: Minimum price filter
  string price_max = 6;                       // OPTIONAL: Maximum price filter
  string quantity_min = 7;                    // OPTIONAL: Minimum quantity filter
  string quantity_max = 8;                    // OPTIONAL: Maximum quantity filter
  repeated bool status_filters = 9;           // OPTIONAL: Status filters [is_filled, is_cancelled, is_expired]
  string creator_address = 10;                // OPTIONAL: Filter by creator address
}

message TradeQueryFilter {
  tech.qomet.agora.api.grpc.common.DateTime from_dt = 1;    // OPTIONAL: Start of time range
  tech.qomet.agora.api.grpc.common.DateTime to_dt = 2;      // OPTIONAL: End of time range
  tech.qomet.agora.api.grpc.common.OrderSide side = 3;      // OPTIONAL: Filter by order side
  string price_min = 4;                       // OPTIONAL: Minimum price filter
  string price_max = 5;                       // OPTIONAL: Maximum price filter
  string volume_min = 6;                      // OPTIONAL: Minimum volume filter
  string volume_max = 7;                      // OPTIONAL: Maximum volume filter
  repeated string trade_types = 8;            // OPTIONAL: Filter by trade types
}

message SettlementQueryFilter {
  tech.qomet.agora.api.grpc.common.DateTime from_dt = 1;           // OPTIONAL: Start of time range
  tech.qomet.agora.api.grpc.common.DateTime to_dt = 2;             // OPTIONAL: End of time range
  tech.qomet.agora.api.grpc.common.ConfirmationStatus status = 3;  // OPTIONAL: Filter by confirmation status
  repeated string settlement_types = 4;              // OPTIONAL: Filter by settlement types
  repeated string asset_id_or_name_regexes = 5;      // OPTIONAL: Filter by asset ID or name regex
  string amount_min = 6;                             // OPTIONAL: Minimum amount filter
  string amount_max = 7;                             // OPTIONAL: Maximum amount filter
}

message OrderbookQueryFilter {
  bool aggregated = 1;                        // OPTIONAL: Whether to aggregate orders (default: false)
  tech.qomet.agora.api.grpc.common.OrderSide side = 2;      // OPTIONAL: Filter by order side
  uint32 depth = 3;                           // OPTIONAL: Order book depth limit
  string price_min = 4;                       // OPTIONAL: Minimum price filter
  string price_max = 5;                       // OPTIONAL: Maximum price filter
  bool include_my_orders = 6;                 // OPTIONAL: Include own orders (default: false)
  string group_by_price_increment = 7;        // OPTIONAL: Price increment for grouping
}

message OrderList {
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 1;   // OPTIONAL: Pagination information
  repeated tech.qomet.agora.api.grpc.common.Order orders = 2;            // REQUIRED: List of orders (can be empty)
}