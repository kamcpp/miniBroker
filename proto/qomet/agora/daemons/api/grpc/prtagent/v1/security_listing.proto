syntax = "proto3";

package tech.qomet.agora.api.grpc.prtagent.v1;

import "common.proto";
import "fin/security_listing.proto";
import "fin/trading.proto";
import "prtagent/v1/query.proto";

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/prtagent/v1;agoraapigrpcprtagentv1";
option java_package = "tech.qomet.agora.api.grpc.prtagent.v1";
option java_outer_classname = "SecurityListing";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.PrtAgent.V1";

service SecurityListingService {
  // Query operations
  rpc GetSecurityListingList(GetSecurityListingListRequest) returns (GetSecurityListingListResponse);
  rpc GetSecurityListingListAsync(GetSecurityListingListRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc GetSecurityListingInfoBatch(GetSecurityListingInfoBatchRequest) returns (GetSecurityListingInfoBatchResponse);
  rpc GetSecurityListingInfoBatchAsync(GetSecurityListingInfoBatchRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  // Trading data
  rpc GetSecurityListingOrders(GetSecurityListingOrdersRequest) returns (GetSecurityListingOrdersResponse);
  rpc GetSecurityListingOrdersAsync(GetSecurityListingOrdersRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc GetSecurityListingTrades(GetSecurityListingTradesRequest) returns (GetSecurityListingTradesResponse);
  rpc GetSecurityListingTradesAsync(GetSecurityListingTradesRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);

  rpc GetSecurityListingSettlements(GetSecurityListingSettlementsRequest) returns (GetSecurityListingSettlementsResponse);
  rpc GetSecurityListingSettlementsAsync(GetSecurityListingSettlementsRequest) returns (tech.qomet.agora.api.grpc.common.ExecutionAsyncResponse);
}

// ============================================================================
// Query Messages
// ============================================================================

message GetSecurityListingListRequest {
  string proposed_execution_id = 1;                                                        // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;                        // OPTIONAL: Pagination parameters
  string symbol_regex = 3;                                                                 // OPTIONAL: Filter by symbol regex
  string security_id_regex = 4;                                                            // OPTIONAL: Filter by security ID regex
  string security_exchange_regex = 5;                                                      // OPTIONAL: Filter by security exchange regex
  repeated string statuses = 7;                                                            // OPTIONAL: Filter by security status

  map<string, string> aux_data = 105;                                                      // OPTIONAL: Additional request data
}

message GetSecurityListingListResponse {
  string ref_execution_id = 1;                                                             // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;                     // OPTIONAL: Pagination information (required if paginated)
  repeated tech.qomet.agora.api.grpc.fin.SecurityListing security_listings = 3;            // REQUIRED: List of security listings (can be empty)

  map<string, string> metadata = 105;                                                      // OPTIONAL: Response metadata
}

message GetSecurityListingInfoBatchRequest {
  string proposed_execution_id = 1;                                                        // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;                        // OPTIONAL: Pagination parameters
  repeated string security_ids = 3;                                                        // REQUIRED: Security IDs to retrieve
  repeated string statuses = 4;                                                            // OPTIONAL: Filter by security status

  map<string, string> aux_data = 105;                                                      // OPTIONAL: Additional request data
}

message GetSecurityListingInfoBatchResponse {
  string ref_execution_id = 1;                                                             // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;                     // OPTIONAL: Pagination information (required if paginated)
  repeated tech.qomet.agora.api.grpc.fin.SecurityListing security_listings = 3;            // REQUIRED: List of security listing details (can be empty)

  map<string, string> metadata = 105;                                                      // OPTIONAL: Response metadata
}

// ============================================================================
// Trading Data Messages
// ============================================================================

message GetSecurityListingOrdersRequest {
  string proposed_execution_id = 1;                                                        // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;                        // OPTIONAL: Pagination parameters
  repeated string security_listing_iids = 3;                                               // REQUIRED: Security listing IIDs
  OrderQueryFilter order_query_filter = 4;                                                 // OPTIONAL: Additional order filters

  map<string, string> aux_data = 105;                                                      // OPTIONAL: Additional request data
}

message GetSecurityListingOrdersResponse {
  string ref_execution_id = 1;                                                             // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;                     // OPTIONAL: Pagination information (required if paginated)
  repeated tech.qomet.agora.api.grpc.fin.Order orders = 3;                                 // REQUIRED: List of orders (can be empty)

  map<string, string> metadata = 105;                                                      // OPTIONAL: Response metadata
}

message GetSecurityListingTradesRequest {
  string proposed_execution_id = 1;                                                        // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;                        // OPTIONAL: Pagination parameters
  repeated string security_listing_iids = 3;                                               // REQUIRED: Security listing IIDs
  TradeQueryFilter trade_query_filter = 4;                                                 // OPTIONAL: Additional trade filters

  map<string, string> aux_data = 105;                                                      // OPTIONAL: Additional request data
}

message GetSecurityListingTradesResponse {
  string ref_execution_id = 1;                                                             // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;                     // OPTIONAL: Pagination information (required if paginated)
  repeated tech.qomet.agora.api.grpc.fin.Trade trades = 3;                                 // REQUIRED: List of trades (can be empty)

  map<string, string> metadata = 105;                                                      // OPTIONAL: Response metadata
}

message GetSecurityListingSettlementsRequest {
  string proposed_execution_id = 1;                                                        // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;                        // OPTIONAL: Pagination parameters
  repeated string security_listing_iids = 3;                                               // REQUIRED: Security listing IIDs
  SettlementQueryFilter settlement_query_filter = 4;                                       // OPTIONAL: Additional settlement filters

  map<string, string> aux_data = 105;                                                      // OPTIONAL: Additional request data
}

message GetSecurityListingSettlementsResponse {
  string ref_execution_id = 1;                                                             // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;                     // OPTIONAL: Pagination information (required if paginated)
  repeated tech.qomet.agora.api.grpc.fin.Settlement settlements = 3;                       // REQUIRED: List of settlements (can be empty)

  map<string, string> metadata = 105;                                                      // OPTIONAL: Response metadata
}
