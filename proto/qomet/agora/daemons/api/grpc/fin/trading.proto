syntax = "proto3";

package tech.qomet.agora.api.grpc.fin;

import "common.proto";

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/fin;agoraapigrpcfin";
option java_package = "tech.qomet.agora.api.grpc.fin";
option java_outer_classname = "TradingProto";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.Fin";

enum ConfirmationStatusEnum {
  CONFIRMATION_STATUS_ENUM_UNKNOWN = 0;
  CONFIRMATION_STATUS_ENUM_CONFIRMED = 1;
  CONFIRMATION_STATUS_ENUM_PENDING = 2;
  CONFIRMATION_STATUS_ENUM_DECLINED = 3;
  CONFIRMATION_STATUS_ENUM_OTHER = 0x0fff0000;
}

enum OrderSideEnum {
  option allow_alias = true;
  ORDER_SIDE_ENUM_UNKNOWN = 0;
  ORDER_SIDE_ENUM_BUY = 1;
  ORDER_SIDE_ENUM_BID = 1;
  ORDER_SIDE_ENUM_CALL = 1;
  ORDER_SIDE_ENUM_SELL = 2;
  ORDER_SIDE_ENUM_ASK = 2;
  ORDER_SIDE_ENUM_PUT = 2;
  ORDER_SIDE_ENUM_BOTH = 3;
  ORDER_SIDE_ENUM_NO_SIDE = 4;
  ORDER_SIDE_ENUM_OTHER = 0x0fff0000;
}

message Order {
  string order_id = 1;                                                                     // REQUIRED: Unique order identifier
  string order_hash = 2;                                                                   // OPTIONAL: Order content hash
  string participant_iid = 3;                                                              // REQUIRED: Participant internal identifier
  string participant_order_id = 4;                                                         // REQUIRED: Participant's order identifier
  string participant_account_iid = 5;                                                      // REQUIRED: Participant account identifier
  string investor_account_iid = 6;                                                         // OPTIONAL: Investor account identifier
  string executor_account_iid = 7;                                                         // OPTIONAL: Executor account identifier

  // Order details
  string order_type = 8;                                                                   // REQUIRED: Order type (LIMIT, MARKET)
  OrderSideEnum side = 9;                                                                  // REQUIRED: Order side
  string symbol = 10;                                                                      // REQUIRED: Trading symbol
  string currency = 11;                                                                    // REQUIRED: Currency code
  string quantity = 12;                                                                    // REQUIRED: Order quantity
  string remaining_quantity = 13;                                                          // OPTIONAL: Remaining quantity
  string price = 14;                                                                       // OPTIONAL: Order price (required for LIMIT)
  string volume = 15;                                                                      // OPTIONAL: Order volume
  string remaining_volume = 16;                                                            // OPTIONAL: Remaining volume
  string slippage = 17;                                                                    // OPTIONAL: Acceptable slippage

  // Time fields
  string time_in_force = 18;                                                               // OPTIONAL: Time in force
  string create_timestamp = 19;                                                            // REQUIRED: Order creation timestamp
  string effective_timestamp = 20;                                                         // OPTIONAL: Effective timestamp
  string expire_timestamp = 21;                                                            // OPTIONAL: Expiration timestamp

  // Status flags
  bool is_offer = 22;                                                                      // OPTIONAL: Whether this is an offer
  bool is_directly_fillable = 23;                                                          // OPTIONAL: Whether directly fillable
  bool is_bid = 24;                                                                        // OPTIONAL: Whether this is a bid
  bool is_filled = 25;                                                                     // OPTIONAL: Whether order is filled
  bool is_cancelled = 26;                                                                  // OPTIONAL: Whether order is cancelled
  bool is_expired = 27;                                                                    // OPTIONAL: Whether order is expired

  // Additional data
  string creator_address = 28;                                                             // OPTIONAL: Creator blockchain address
  string trezor_stash_id = 29;                                                             // OPTIONAL: Trezor stash identifier
  string offer_ids = 30;                                                                   // OPTIONAL: Related offer identifiers
  string parent_direct_order_id = 31;                                                      // OPTIONAL: Parent order identifier
  string alarm_abi = 32;                                                                   // OPTIONAL: Alarm ABI specification
  string alarm_data = 33;                                                                  // OPTIONAL: Alarm data
  string data = 34;                                                                        // OPTIONAL: Additional order data
  string data_encoding = 35;                                                               // OPTIONAL: Data encoding format
  string participant_data = 36;                                                            // OPTIONAL: Participant-specific data
}

message Trade {
  string trade_id = 1;                                                                     // REQUIRED: Unique trade identifier
  string trade_hash = 2;                                                                   // OPTIONAL: Trade content hash
  string timestamp = 3;                                                                    // REQUIRED: Trade execution timestamp
  string creator_address = 4;                                                              // OPTIONAL: Creator blockchain address
  string trade_type = 5;                                                                   // OPTIONAL: Type of trade
  bool is_buy = 6;                                                                         // REQUIRED: Whether this is a buy trade

  // Order references
  string bid_order_id = 7;                                                                 // REQUIRED: Bid order identifier
  string ask_order_id = 8;                                                                 // REQUIRED: Ask order identifier

  // Trade details
  string quantity = 9;                                                                     // REQUIRED: Trade quantity
  string price = 10;                                                                       // REQUIRED: Trade execution price
  string volume = 11;                                                                      // REQUIRED: Trade volume

  // Fees
  string bid_fee = 12;                                                                     // OPTIONAL: Fee paid by bid side
  string ask_fee = 13;                                                                     // OPTIONAL: Fee paid by ask side

  // Additional data
  string data_abi = 14;                                                                    // OPTIONAL: Data ABI specification
  string data = 15;                                                                        // OPTIONAL: Additional trade data
}

message Settlement {
  string settlement_id = 1;                                                                // REQUIRED: Unique settlement identifier
  string settlement_hash = 2;                                                              // OPTIONAL: Settlement content hash
  string timestamp = 3;                                                                    // REQUIRED: Settlement timestamp

  // Trade reference
  string trade_id = 4;                                                                     // REQUIRED: Related trade identifier
  string trade_hash = 5;                                                                   // OPTIONAL: Related trade hash

  // Settlement status
  ConfirmationStatusEnum confirmation_status = 6;                                          // REQUIRED: Current confirmation status
  string settlement_type = 7;                                                              // OPTIONAL: Type of settlement

  // Parties involved
  string buyer_account = 8;                                                                // REQUIRED: Buyer account identifier
  string seller_account = 9;                                                               // REQUIRED: Seller account identifier

  // Settlement details
  string asset_transferred = 10;                                                           // REQUIRED: Asset being transferred
  string amount_transferred = 11;                                                          // REQUIRED: Amount transferred
  string currency_transferred = 12;                                                        // OPTIONAL: Currency transferred
  string currency_amount = 13;                                                             // OPTIONAL: Currency amount

  // Settlement location
  string ledger_id = 14;                                                                   // OPTIONAL: Ledger identifier
  string vault_address = 15;                                                               // OPTIONAL: Vault address
  string reserve_id = 16;                                                                  // OPTIONAL: Reserve identifier

  // Additional data
  string failure_reason = 17;                                                              // OPTIONAL: Failure reason (if failed)
  string data = 18;                                                                        // OPTIONAL: Additional settlement data
}

message OrderEvent {
  string order_event_id = 1;                                                               // REQUIRED: Unique event identifier
  string order_event_hash = 2;                                                             // OPTIONAL: Event content hash
  string order_event_timestamp = 3;                                                        // REQUIRED: Event timestamp
  string order_event_type = 4;                                                             // REQUIRED: Type of order event
  string order_event_version = 5;                                                          // OPTIONAL: Event schema version

  // Order reference
  Order order = 6;                                                                         // REQUIRED: Primary order for this event
  Order other_order = 7;                                                                   // OPTIONAL: Secondary order (for matching events)

  // Trade reference (if applicable)
  Trade trade = 8;                                                                         // OPTIONAL: Related trade (if event involves trade)

  // Chain and indexing information
  string chain_id = 9;                                                                     // OPTIONAL: Blockchain chain identifier
  string chain_name = 10;                                                                  // OPTIONAL: Blockchain chain name
  string engine_address = 11;                                                              // OPTIONAL: Trading engine address
  string index_timestamp = 12;                                                             // OPTIONAL: Index timestamp
  string index_block_timestamp = 13;                                                       // OPTIONAL: Block timestamp
  string index_block_number = 14;                                                          // OPTIONAL: Block number
  string index_tx_hash = 15;                                                               // OPTIONAL: Transaction hash
  int64 index_tx_log_idx = 16;                                                             // OPTIONAL: Transaction log index

  // Pair information
  string pair_id = 17;                                                                     // OPTIONAL: Trading pair identifier
  string pair_base_token_symbol = 18;                                                      // OPTIONAL: Base token symbol
  string pair_quote_token_symbol = 19;                                                     // OPTIONAL: Quote token symbol

  // Command information (for audit)
  string command_id = 20;                                                                  // OPTIONAL: Command identifier
  string command_request_id = 21;                                                          // OPTIONAL: Command request identifier
  string command_timestamp = 22;                                                           // OPTIONAL: Command timestamp
  string command_origin = 23;                                                              // OPTIONAL: Command origin
  string command_participant_id = 24;                                                      // OPTIONAL: Command participant identifier
  string command_operation = 25;                                                           // OPTIONAL: Command operation

  // Additional event data
  string order_event_data = 26;                                                            // OPTIONAL: Additional event data
}

enum TransactionTypeEnum {
  TRANSACTION_TYPE_ENUM_UNKNOWN = 0;

  TRANSACTION_TYPE_ENUM_DEPOSIT_CASH = 1;
  TRANSACTION_TYPE_ENUM_DEPOSIT_ASSET = 2;
  TRANSACTION_TYPE_ENUM_WITHDRAW_CASH = 3;
  TRANSACTION_TYPE_ENUM_WITHDRAW_ASSET = 4;
  TRANSACTION_TYPE_ENUM_TRADE_BUY = 5;
  TRANSACTION_TYPE_ENUM_TRADE_SELL = 6;
  TRANSACTION_TYPE_ENUM_FEE = 7;
  TRANSACTION_TYPE_ENUM_SETTLEMENT = 8;
  TRANSACTION_TYPE_ENUM_TRANSFER_IN = 9;
  TRANSACTION_TYPE_ENUM_TRANSFER_OUT = 10;

  TRANSACTION_TYPE_ENUM_OTHER = 0x0fff0000;
}

// Transaction message reflects Activity structure with from/to accounts and stashes
// This structure mirrors the Activity model from pkg/chain/trezor/activity.go
message Transaction {
  // Core identifiers
  string transaction_id = 1;                                                               // REQUIRED: Unique transaction identifier
  string transaction_hash = 2;                                                             // OPTIONAL: Transaction content hash
  tech.qomet.agora.api.grpc.common.Time timestamp = 3;                                     // REQUIRED: Transaction timestamp

  // Transaction type and operation
  TransactionTypeEnum type = 4;                                                            // REQUIRED: Transaction type
  string operation = 5;                                                                    // OPTIONAL: Specific operation code

  // Account information (reflecting Activity structure)
  string account_iid = 6;                                                                  // REQUIRED: Primary account for this transaction
  string from_account_iid = 7;                                                             // OPTIONAL: Source account
  string to_account_iid = 8;                                                               // OPTIONAL: Destination account

  // Reserve IDs (from Activity model)
  string from_reserve_id = 9;                                                              // OPTIONAL: Source reserve identifier
  string to_reserve_id = 10;                                                               // OPTIONAL: Destination reserve identifier

  // Stash information (critical for the Activity model)
  string from_stash = 11;                                                                  // OPTIONAL: Source stash
  string to_stash = 12;                                                                    // OPTIONAL: Destination stash

  // Asset and amount
  string asset_iid = 13;                                                                   // REQUIRED: Asset being transferred
  string amount = 14;                                                                      // REQUIRED: Transaction amount

  // Reference information
  string reference_id = 15;                                                                // OPTIONAL: Reference ID (order_id, trade_id, settlement_id, etc.)
  string reference_type = 16;                                                              // OPTIONAL: Reference type ("order", "trade", "settlement", etc.)

  // Additional fields
  map<string, string> display_names = 101;                                                 // OPTIONAL: Display names for localization
  map<string, string> descriptions = 102;                                                  // OPTIONAL: Descriptions for localization
  map<string, string> labels = 103;                                                        // OPTIONAL: Key-value labels
  repeated string tags = 104;                                                              // OPTIONAL: Tags for categorization
  map<string, string> metadata = 105;                                                      // OPTIONAL: Additional metadata
}
