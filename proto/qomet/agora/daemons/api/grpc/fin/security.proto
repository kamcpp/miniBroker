syntax = "proto3";

package tech.qomet.agora.api.grpc.fin;

import "common.proto";
import "fin/asset.proto";
import "fin/identifier.proto";
import "fin/participant.proto";

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/fin;agoraapigrpcfin";
option java_package = "tech.qomet.agora.api.grpc.fin";
option java_outer_classname = "SecurityProto";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.Fin";

enum SecurityClassEnum {
  SECURITY_CLASS_ENUM_UNKNOWN = 0;

  SECURITY_CLASS_ENUM_EQUITY_SHARE = 1;
  SECURITY_CLASS_ENUM_TOKENIZED_SECURITY = 2;
  SECURITY_CLASS_ENUM_FUND_UNIT = 3;
  SECURITY_CLASS_ENUM_ETF_SHARE = 4;
  SECURITY_CLASS_ENUM_ETF = 5;
  SECURITY_CLASS_ENUM_BOND = 6;
  SECURITY_CLASS_ENUM_EQUITY_DERIVATIVE = 7;
  SECURITY_CLASS_ENUM_INDEX_DERIVATIVE = 8;
  SECURITY_CLASS_ENUM_FX = 9;
  SECURITY_CLASS_ENUM_WARRANT = 10;
  SECURITY_CLASS_ENUM_CFD = 11;
  SECURITY_CLASS_ENUM_OPTION = 12;
  SECURITY_CLASS_ENUM_FUTURE = 13;
  SECURITY_CLASS_ENUM_SMART_CONTRACT = 14;
  SECURITY_CLASS_ENUM_COMMODITY = 15;
  SECURITY_CLASS_ENUM_DIGITAL_TOKEN = 16;

  SECURITY_CLASS_ENUM_OTHER = 0x0fff0000;
}

message FinSecurityClass {
  string schema = 1;
  repeated SecurityClassEnum classes = 2;

  map<string, string> display_names = 101;
  map<string, string> descriptions = 102;
  map<string, string> labels = 103;
  repeated string tags = 104;
  map<string, string> metadata = 105;
}

enum SecurityStatusEnum {
  SECURITY_STATUS_ENUM_UNKNOWN = 0;

  SECURITY_STATUS_ENUM_PENDING = 1;                                                        // Security is pending issuance
  SECURITY_STATUS_ENUM_ACTIVE = 2;                                                         // Security is active and tradable
  SECURITY_STATUS_ENUM_SUSPENDED = 3;                                                      // Security is temporarily suspended
  SECURITY_STATUS_ENUM_MATURED = 4;                                                        // Security has matured
  SECURITY_STATUS_ENUM_CANCELLED = 5;                                                      // Security was cancelled
  SECURITY_STATUS_ENUM_IMPORTED = 6;                                                       // Security was imported from external depository

  SECURITY_STATUS_ENUM_OTHER = 0x0fff0000;
}

message Security {
  string iid = 1;                                                                          // REQUIRED: Internal security identifier

  repeated FinIdentifier identifiers = 2;                                                  // REQUIRED: List of security identifiers
  string cfi_code = 3;                                                                     // REQUIRED: CFI 6 letters code
  repeated FinSecurityClass classes = 4;                                                   // REQUIRED: List of security classifications

  tech.qomet.agora.api.grpc.common.DateTime maturity_dt = 5;                               // OPTIONAL: Security maturity date

  oneof asset {                                                                            // REQUIRED: Underlying asset
    string asset_iid = 6;                                                                  // Asset internal identifier
    Asset asset_obj = 7;                                                                   // Asset object
  }

  tech.qomet.agora.api.grpc.common.DateTime issue_dt = 8;                                  // REQUIRED: Issue date
  repeated OneOfIdOrParticipant issuers = 9;                                               // OPTIONAL: List of issuers
  string issue_country_code = 10;                                                          // REQUIRED: ISO 3166-1 alpha-2
  string issue_currency = 11;                                                              // REQUIRED: ISO 4217 currency code
  string issue_initial_units = 12;                                                         // REQUIRED: Number of shares issued
  string issue_divisibility = 13;                                                          // REQUIRED: Unit divisibility
  string issue_initial_authorized_units = 14;                                              // OPTIONAL: Number of shares authorized

  map<string, string> display_names = 101;                                                 // OPTIONAL: Display names for localization
  map<string, string> descriptions = 102;                                                  // OPTIONAL: Descriptions for localization
  map<string, string> labels = 103;                                                        // OPTIONAL: Key-value labels
  repeated string tags = 104;                                                              // OPTIONAL: Tags for categorization
  map<string, string> metadata = 105;                                                      // OPTIONAL: Additional metadata
}

