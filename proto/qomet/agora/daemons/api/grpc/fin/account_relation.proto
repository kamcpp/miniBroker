syntax = "proto3";

package tech.qomet.agora.api.grpc.fin;

import "common.proto";

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/fin;agoraapigrpcfin";
option java_package = "tech.qomet.agora.api.grpc.fin";
option java_outer_classname = "AccountRelationProto";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.Fin";

enum AccountToAccountRelationTypeEnum {
  ACCOUNT_TO_ACCOUNT_RELATION_TYPE_ENUM_UNKNOWN = 0;

  ACCOUNT_TO_ACCOUNT_RELATION_TYPE_ENUM_PARENT_CHILD = 1;                                 // Hierarchical (e.g. omnibus → sub-account)
  ACCOUNT_TO_ACCOUNT_RELATION_TYPE_ENUM_HOUSE_CLIENT = 2;                                 // Separation between proprietary and client
  ACCOUNT_TO_ACCOUNT_RELATION_TYPE_ENUM_NOMINEE_BENEFICIAL = 3;                           // Nominee vs. beneficial owner
  ACCOUNT_TO_ACCOUNT_RELATION_TYPE_ENUM_COLLATERAL_LINK = 4;                              // Pledged / blocked collateral
  ACCOUNT_TO_ACCOUNT_RELATION_TYPE_ENUM_ESCROW_CONDITIONAL = 5;                           // Conditional holding
  ACCOUNT_TO_ACCOUNT_RELATION_TYPE_ENUM_CROSS_PARTICIPANT = 6;                            // Mirror / link between two participants
  ACCOUNT_TO_ACCOUNT_RELATION_TYPE_ENUM_ISSUANCE_FLOW = 7;                                // Issuer account → investor accounts
  ACCOUNT_TO_ACCOUNT_RELATION_TYPE_ENUM_REPORTING_POOL = 8;                               // Aggregation/grouping

  ACCOUNT_TO_ACCOUNT_RELATION_TYPE_ENUM_OTHER = 0x0fff0000;
}

message AccountToAccountRelation {
  string iid = 1;                                                                          // REQUIRED: Internal relation identifier

  string from_account_iid = 2;                                                             // REQUIRED: From account internal identifier
  string to_account_iid = 3;                                                               // REQUIRED: To account internal identifier

  AccountToAccountRelationTypeEnum relation_type = 4;                                      // REQUIRED: Type of relation

  tech.qomet.agora.api.grpc.common.DateTime effective_from_dt = 5;                         // OPTIONAL: Relation effective start date
  tech.qomet.agora.api.grpc.common.DateTime effective_to_dt = 6;                           // OPTIONAL: Relation effective end date

  map<string, string> display_names = 101;                                                 // OPTIONAL: Display names for localization
  map<string, string> descriptions = 102;                                                  // OPTIONAL: Descriptions for localization
  map<string, string> labels = 103;                                                        // OPTIONAL: Key-value labels
  repeated string tags = 104;                                                              // OPTIONAL: Tags for categorization
  map<string, string> metadata = 105;                                                      // OPTIONAL: Additional metadata
}
