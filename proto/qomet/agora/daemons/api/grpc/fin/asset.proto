syntax = "proto3";

package tech.qomet.agora.api.grpc.fin;

import "common.proto";
import "fin/identifier.proto";

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/fin;agoraapigrpcfin";
option java_package = "tech.qomet.agora.api.grpc.fin";
option java_outer_classname = "AssetProto";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.Fin";

enum AssetClassEnum {
  ASSET_CLASS_ENUM_UNKNOWN = 0;

  ASSET_CLASS_ENUM_EQUITY = 1;
  ASSET_CLASS_ENUM_BOND = 2;
  ASSET_CLASS_ENUM_ETF = 3;
  ASSET_CLASS_ENUM_COMPANY = 4;
  ASSET_CLASS_ENUM_GOVERNMENT = 5;
  ASSET_CLASS_ENUM_CURRENCY = 6;
  ASSET_CLASS_ENUM_DIGITAL_CURRENCY = 7;
  ASSET_CLASS_ENUM_CRYPTO = 8;
  ASSET_CLASS_ENUM_COMMODITY = 9;
  ASSET_CLASS_ENUM_PRECIOUS_METAL = 10;
  ASSET_CLASS_ENUM_INDUSTRIAL_METALS = 11;
  ASSET_CLASS_ENUM_RWA = 12;
  ASSET_CLASS_ENUM_STABLECOIN = 13;
  ASSET_CLASS_ENUM_NFT = 14;
  ASSET_CLASS_ENUM_REAL_ESTATE = 15;
  ASSET_CLASS_ENUM_FUND = 16;
  ASSET_CLASS_ENUM_INDEX = 17;
  ASSET_CLASS_ENUM_CREDIT = 18;
  ASSET_CLASS_ENUM_DIGITAL = 19;
  ASSET_CLASS_ENUM_LEDGER_NATIVE_COIN = 20;
  ASSET_CLASS_ENUM_EXTERNAL_INSTRUMENT = 21;

  ASSET_CLASS_ENUM_OTHER = 0x0fff0000;
}

message FinAssetClass {
  string schema = 1;                                                                       // REQUIRED: Classification schema name
  repeated AssetClassEnum classes = 2;                                                     // REQUIRED: List of asset classes (can be empty)

  map<string, string> display_names = 101;                                                 // OPTIONAL: Display names for localization
  map<string, string> descriptions = 102;                                                  // OPTIONAL: Descriptions for localization
  map<string, string> labels = 103;                                                        // OPTIONAL: Key-value labels
  repeated string tags = 104;                                                              // OPTIONAL: Tags for categorization
  map<string, string> metadata = 105;                                                      // OPTIONAL: Additional metadata
}

message Asset {
  string iid = 1;                                                                          // REQUIRED: Internal asset identifier

  repeated FinIdentifier identifiers = 2;                                                  // OPTIONAL: List of asset identifiers
  repeated FinAssetClass classes = 3;                                                      // OPTIONAL: List of asset classifications

  map<string, string> display_names = 101;                                                 // OPTIONAL: Display names for localization
  map<string, string> descriptions = 102;                                                  // OPTIONAL: Descriptions for localization
  map<string, string> labels = 103;                                                        // OPTIONAL: Key-value labels
  repeated string tags = 104;                                                              // OPTIONAL: Tags for categorization
  map<string, string> metadata = 105;                                                      // OPTIONAL: Additional metadata
}

message Holdings {
  oneof asset_id {                                                                         // REQUIRED: Must specify one asset type
    string instrument_iid = 1;                                                             // Instrument internal ID
    string currency_code = 2;                                                              // ISO 4217 currency code
  }
  string total_units = 3;                                                                  // REQUIRED: Total units held
  map<string, string> stash_units = 4;                                                     // OPTIONAL: Units by stash (stash-name -> units)
}

message Portfolio {
  string account_iid = 1;                                                                  // REQUIRED: Associated account ID
  tech.qomet.agora.api.grpc.common.DateTime generated_at_dt = 2;                           // REQUIRED: Portfolio generation timestamp
  map<string, Holdings> holdings = 3;                                                      // REQUIRED: Holdings by asset (can be empty)

  map<string, string> metadata = 105;                                                      // OPTIONAL: Additional metadata
}
