syntax = "proto3";

package tech.qomet.agora.api.grpc.fin;

import "fin/identifier.proto";

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/fin;agoraapigrpcfin";
option java_package = "tech.qomet.agora.api.grpc.fin";
option java_outer_classname = "ParticipantProto";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.Fin";

enum ParticipantTypeEnum {
  PARTICIPANT_TYPE_ENUM_UNKNOWN = 0;

  PARTICIPANT_TYPE_ENUM_INDIVIDUAL = 1;
  PARTICIPANT_TYPE_ENUM_CORPORATE = 2;
  PARTICIPANT_TYPE_ENUM_GOVERMENTAL = 3;
  PARTICIPANT_TYPE_ENUM_FINANCIAL_INSTITUTION = 4;
  PARTICIPANT_TYPE_ENUM_MARKET = 5;
  PARTICIPANT_TYPE_ENUM_VENUE = 6;
  PARTICIPANT_TYPE_ENUM_CUSTODIAN = 7;
  PARTICIPANT_TYPE_ENUM_BROKER_DEALER = 8;
  PARTICIPANT_TYPE_ENUM_CLEARING_HOUSE = 9;
  PARTICIPANT_TYPE_ENUM_CSD = 10;
  PARTICIPANT_TYPE_ENUM_REGULATOR = 11;
  PARTICIPANT_TYPE_ENUM_EXTERNAL_PRINCIPAL = 12;                                          // Wallet, Personal Eth. Account (Private Key), etc.
  PARTICIPANT_TYPE_ENUM_INTERNAL_PRINCIPAL = 13;                                          // Managed Eth. Account (Managed Private Key), etc.
  PARTICIPANT_TYPE_ENUM_SERVICE_PROVIDER = 14;
  PARTICIPANT_TYPE_ENUM_ISSUER = 15;                                                      // Instrument Issuer, etc.
  PARTICIPANT_TYPE_ENUM_INVESTOR = 16;                                                    // Asset Investor, etc.
  PARTICIPANT_TYPE_ENUM_TRADER = 17;                                                      // Asset Trader, etc.
  PARTICIPANT_TYPE_ENUM_MINER_VALIDATOR = 18;                                             // Blockchain Miner, Validator, etc.
  PARTICIPANT_TYPE_ENUM_LIQUIDITY_PROVIDER = 19;                                          // Market Maker, Liquidity Provider, etc.
  PARTICIPANT_TYPE_ENUM_ORACLE = 20;                                                      // Price Oracle, Data Oracle, etc.
  PARTICIPANT_TYPE_ENUM_AGENT = 21;                                                       // Transfer Agent, Paying Agent, etc.
  PARTICIPANT_TYPE_ENUM_FUND_ADMINISTRATOR = 22;                                          // Fund Administrator, etc.
  PARTICIPANT_TYPE_ENUM_AUDITOR = 23;                                                     // Auditor, Compliance Officer, etc.
  PARTICIPANT_TYPE_ENUM_LEGAL_ENTITY = 24;                                                // Legal Entity, Law Firm, etc.
  PARTICIPANT_TYPE_ENUM_ACCOUNTING_ENTITY = 25;                                           // Accounting Firm, etc.
  PARTICIPANT_TYPE_ENUM_TAX_ENTITY = 26;                                                  // Tax Authority, Tax Consultant, etc.
  PARTICIPANT_TYPE_ENUM_INSURANCE_ENTITY = 27;                                            // Insurance Company, Insurance Broker, etc.
  PARTICIPANT_TYPE_ENUM_PENSION_ENTITY = 28;                                              // Pension Fund, Pension Consultant, etc.
  PARTICIPANT_TYPE_ENUM_PAYMENT_ENTITY = 29;                                              // Payment Processor, Payment Gateway, etc.
  PARTICIPANT_TYPE_ENUM_TECHNOLOGY_PROVIDER = 30;                                         // IT Service Provider, Cloud Provider, etc.
  PARTICIPANT_TYPE_ENUM_DATA_PROVIDER = 31;                                               // Market Data Provider, Financial Data Provider, etc.

  PARTICIPANT_TYPE_ENUM_OTHER = 0x0fff0000;
}

message Participant {
  string iid = 1;                                                                          // REQUIRED: Internal participant identifier

  repeated FinIdentifier identifiers = 2;                                                  // AT LEAST ONE IS REQUIRED: List of participant identifiers (BIC, LET, etc)

  repeated ParticipantTypeEnum types = 3;                                                  // AT LEAST ONE IS REQUIRED: List of participant types (can be empty)

  map<string, string> display_names = 101;                                                 // OPTIONAL: Display names for localization
  map<string, string> descriptions = 102;                                                  // OPTIONAL: Descriptions for localization
  map<string, string> labels = 103;                                                        // OPTIONAL: Key-value labels
  repeated string tags = 104;                                                              // OPTIONAL: Tags for categorization
  map<string, string> metadata = 105;                                                      // OPTIONAL: Additional metadata
}

message OneOfIdOrParticipant {
  oneof participant {
    string iid = 1;
    Participant obj = 2;
  }
}
