syntax = "proto3";

package tech.qomet.agora.api.grpc.fin;

import "fin/identifier.proto";
import "fin/participant.proto";

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/fin;agoraapigrpcfin";
option java_package = "tech.qomet.agora.api.grpc.fin";
option java_outer_classname = "InvestorProto";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.Fin";

enum InvestorTypeEnum {
  INVESTOR_TYPE_ENUM_UNKNOWN = 0;

  INVESTOR_TYPE_ENUM_INDIVIDUAL = 1;
  INVESTOR_TYPE_ENUM_RETAIL = 2;
  INVESTOR_TYPE_ENUM_INSTITUTIONAL = 3;
  INVESTOR_TYPE_ENUM_ACCREDITED = 4;
  INVESTOR_TYPE_ENUM_ADVANCED = 5;

  INVESTOR_TYPE_ENUM_OTHER = 0x0fff0000;
}

enum InvestorStatusEnum {
  INVESTOR_STATUS_ENUM_UNKNOWN = 0;

  INVESTOR_STATUS_ENUM_ACTIVE = 1;
  INVESTOR_STATUS_ENUM_INACTIVE = 2;
  INVESTOR_STATUS_ENUM_SUSPENDED = 3;
  INVESTOR_STATUS_ENUM_BLOCKED = 4;
  INVESTOR_STATUS_ENUM_CLOSED = 5;
  INVESTOR_STATUS_ENUM_PENDING = 6;
  INVESTOR_STATUS_ENUM_TERMINATED = 7;

  INVESTOR_STATUS_ENUM_OTHER = 0x0fff0000;
}

message Investor {
  string iid = 1;                                                                          // REQUIRED: Internal investor identifier

  repeated FinIdentifier identifiers = 2;                                                  // OPTIONAL: List of investor identifiers (BIC, LET, etc)
  string external_investor_id = 3;                                                         // OPTIONAL: External investor identifier stored by prtagent

  repeated InvestorTypeEnum types = 4;                                                     // AT LEAST ONE IS REQUIRED: List of investor types (can be empty)

  OneOfIdOrParticipant broker_participant = 5;                                             // REQUIRED: Associated broker participant internal IID

  InvestorStatusEnum investor_status = 6;                                                  // REQUIRED: Current investor status

  map<string, string> display_names = 101;                                                 // OPTIONAL: Display names for localization
  map<string, string> descriptions = 102;                                                  // OPTIONAL: Descriptions for localization
  map<string, string> labels = 103;                                                        // OPTIONAL: Key-value labels
  repeated string tags = 104;                                                              // OPTIONAL: Tags for categorization
  map<string, string> metadata = 105;                                                      // OPTIONAL: Additional metadata
}

enum InvestorToAccountRelationTypeEnum {
  INVESTOR_TO_ACCOUNT_RELATION_TYPE_ENUM_UNKNOWN = 0;

  INVESTOR_TO_ACCOUNT_RELATION_TYPE_ENUM_OWNER = 1;                                        // Investor owns the account
  INVESTOR_TO_ACCOUNT_RELATION_TYPE_ENUM_AUTHORIZED = 2;                                   // Investor is authorized to trade

  INVESTOR_TO_ACCOUNT_RELATION_TYPE_ENUM_OTHER = 0x0fff0000;
}

message InvestorToAccountRelation {
  string iid = 1;                                                                          // REQUIRED: Internal relation identifier

  string investor_iid = 2;                                                                 // REQUIRED: Investor internal identifier
  string account_iid = 3;                                                                  // REQUIRED: Account internal identifier

  repeated InvestorToAccountRelationTypeEnum relations = 4;                                // REQUIRED: Relation types

  string effective_from_ts = 5;                                                            // OPTIONAL: Effective from timestamp (ISO 8601)
  string effective_to_ts = 6;                                                              // OPTIONAL: Effective to timestamp (ISO 8601)

  map<string, string> display_names = 101;                                                 // OPTIONAL: Display names for localization
  map<string, string> descriptions = 102;                                                  // OPTIONAL: Descriptions for localization
  map<string, string> labels = 103;                                                        // OPTIONAL: Key-value labels
  repeated string tags = 104;                                                              // OPTIONAL: Tags for categorization
  map<string, string> metadata = 105;                                                      // OPTIONAL: Additional metadata
}
