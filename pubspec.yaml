  grpc: ^3.2.4
  protobuf: ^3.1.0
  candlesticks:
    path: packages/candlesticks
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.11.0
  printing: ^5.13.0
  file_picker: ^8.0.0+1
  path_provider: ^2.1.1
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
