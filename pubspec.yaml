version: 0.0.48+49

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  path: ^1.8.3
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  crypto: ^3.0.5
