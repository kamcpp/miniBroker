syntax = "proto3";

package tech.qomet.agora.api.grpc.prtagent.v1;

import "common.proto";

option go_package = "qomet.tech/agora/daemons/gen-pkg/tech/qomet/agora/api/grpc/prtagent/v1;agoraapigrpcprtagentv1";
option java_package = "tech.qomet.agora.api.grpc.prtagent.v1";
option java_outer_classname = "Reporting";
option csharp_namespace  = "Tech.Qomet.Agora.Api.Grpc.PrtAgent.V1";

service AdminService {
  // GetExecutionReports returns paginated execution reports for the authenticated participant.
  rpc GetExecutionReports(GetExecutionReportsRequest) returns (GetExecutionReportsResponse);

  // GetTradeReports returns paginated trade reports for the authenticated participant.
  rpc GetTradeReports(GetTradeReportsRequest) returns (GetTradeReportsResponse);

  // GetTreasuryActivities returns paginated treasury activities for the authenticated participant.
  rpc GetTreasuryActivities(GetTreasuryActivitiesRequest) returns (GetTreasuryActivitiesResponse);

  // GetAgoraEvents returns paginated raw on-chain AgoraEngine events for the authenticated participant.
  rpc GetAgoraEvents(GetAgoraEventsRequest) returns (GetAgoraEventsResponse);

  // ---------------------------------------------------------------------------
  // Saga Watch
  // ---------------------------------------------------------------------------

  // ListSagas returns a paginated list of saga instances for the participant's cluster.
  rpc ListSagas(ListSagasRequest) returns (ListSagasResponse);

  // GetSaga returns a single saga instance with its steps and step summary.
  rpc GetSaga(GetSagaRequest) returns (GetSagaResponse);

  // GetSagaTree returns the full saga hierarchy (root + all descendant sub-sagas) with steps.
  rpc GetSagaTree(GetSagaTreeRequest) returns (GetSagaTreeResponse);

  // WatchSaga streams real-time status updates for a saga instance until it reaches a terminal state.
  rpc WatchSaga(WatchSagaRequest) returns (stream SagaWatchEvent);
}

// ============================================================================
// Execution Reports
// ============================================================================

message GetExecutionReportsRequest {
  string proposed_execution_id = 1;                                     // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;    // REQUIRED: Pagination parameters

  // Optional filters
  string request_id = 3;                                                // OPTIONAL: Filter by request_id
  string symbol = 4;                                                    // OPTIONAL: Filter by symbol (exact match)
  string currency = 5;                                                  // OPTIONAL: Filter by currency (exact match)
  string exec_type = 6;                                                 // OPTIONAL: Filter by exec_type (e.g. "0"=NEW, "F"=FILL)
  string side = 7;                                                      // OPTIONAL: Filter by side (e.g. "1"=BUY, "2"=SELL)
  string venue_iid = 8;                                                 // OPTIONAL: Filter by venue_iid (exact match)

  // Time range filters (ISO8601/RFC3339)
  string from_date = 10;                                                // OPTIONAL: Lower bound on created_at
  string to_date = 11;                                                  // OPTIONAL: Upper bound on created_at

  // Sorting
  string sort_by = 12;                                                  // OPTIONAL: Field to sort by (default: "created_at")
  string sort_direction = 13;                                           // OPTIONAL: "asc" or "desc" (default: "desc")

  // Search
  string search = 14;                                                   // OPTIONAL: ILIKE search across symbol, cl_ord_id, order_id, exec_id, text

  map<string, string> aux_data = 105;                                   // OPTIONAL: Additional request data
}

message ExecutionReport {
  string iid = 1;
  string request_id = 2;
  string venue_iid = 3;
  string cl_ord_id = 4;
  string order_id = 5;
  string exec_id = 6;
  string exec_type = 7;
  string ord_status = 8;
  string symbol = 9;
  string side = 10;
  string leaves_qty = 11;
  string cum_qty = 12;
  string avg_px = 13;
  string price = 14;
  string order_qty = 15;
  string currency = 16;
  string transact_time = 17;
  string text = 18;
  string created_at = 19;
  string raw_fix_message = 20;
  string ex_destination = 21;
  string last_qty = 22;
  string last_px = 23;
}

message GetExecutionReportsResponse {
  string ref_execution_id = 1;                                          // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2; // REQUIRED: Pagination information
  repeated ExecutionReport execution_reports = 3;                       // REQUIRED: List of execution reports (can be empty)

  map<string, string> metadata = 105;                                   // OPTIONAL: Response metadata
}

// ============================================================================
// Trade Reports
// ============================================================================

message GetTradeReportsRequest {
  string proposed_execution_id = 1;                                     // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;    // REQUIRED: Pagination parameters

  // Optional filters
  string symbol = 3;                                                    // OPTIONAL: Filter by symbol (exact match)
  string currency = 4;                                                  // OPTIONAL: Filter by currency (exact match)
  string side = 5;                                                      // OPTIONAL: Filter by side
  string venue_iid = 6;                                                 // OPTIONAL: Filter by venue_iid (exact match)

  // Time range filters (ISO8601/RFC3339)
  string from_date = 10;                                                // OPTIONAL: Lower bound on created_at
  string to_date = 11;                                                  // OPTIONAL: Upper bound on created_at

  // Sorting
  string sort_by = 12;                                                  // OPTIONAL: Field to sort by (default: "created_at")
  string sort_direction = 13;                                           // OPTIONAL: "asc" or "desc" (default: "desc")

  // Search
  string search = 14;                                                   // OPTIONAL: ILIKE search across symbol, trade_report_id, exec_id, text

  map<string, string> aux_data = 105;                                   // OPTIONAL: Additional request data
}

message TradeReport {
  string iid = 1;
  string venue_iid = 2;
  string trade_report_id = 3;
  string exec_id = 4;
  string symbol = 5;
  string currency = 6;
  string side = 7;
  string last_qty = 8;
  string last_px = 9;
  string transact_time = 10;
  string text = 11;
  string created_at = 12;
  string raw_fix_message = 13;
}

message GetTradeReportsResponse {
  string ref_execution_id = 1;                                          // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2; // REQUIRED: Pagination information
  repeated TradeReport trade_reports = 3;                               // REQUIRED: List of trade reports (can be empty)

  map<string, string> metadata = 105;                                   // OPTIONAL: Response metadata
}

// ============================================================================
// Treasury Activities
// ============================================================================

message GetTreasuryActivitiesRequest {
  string proposed_execution_id = 1;                                     // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;    // REQUIRED: Pagination parameters

  // Optional filters
  string operation = 3;                                                 // OPTIONAL: Filter by operation name (e.g. "DEPOSIT_TO_VAULT")
  string contract_addr = 4;                                             // OPTIONAL: Filter by contract address
  string from_vault = 5;                                                // OPTIONAL: Filter by from_vault
  string to_vault = 6;                                                  // OPTIONAL: Filter by to_vault
  string from_account = 7;                                              // OPTIONAL: Filter by from_account
  string to_account = 8;                                                // OPTIONAL: Filter by to_account
  string sender_account = 9;                                            // OPTIONAL: Filter by sender_account
  string deployment_iid = 10;                                           // OPTIONAL: Filter by deployment_iid
  string legal_structure_iid = 11;                                      // OPTIONAL: Filter by legal_structure_iid

  // Time range filters (ISO8601/RFC3339 or unix timestamp string)
  string from_ts = 15;                                                  // OPTIONAL: Lower bound on timestamp
  string to_ts = 16;                                                    // OPTIONAL: Upper bound on timestamp

  // Sorting
  string sort_by = 17;                                                  // OPTIONAL: Field to sort by (default: "created_at")
  string sort_direction = 18;                                           // OPTIONAL: "asc" or "desc" (default: "desc")

  // Search
  string search = 19;                                                   // OPTIONAL: ILIKE search across sender_account, from_account, to_account, vaults, token_id, etc.

  map<string, string> aux_data = 105;                                   // OPTIONAL: Additional request data
}

message TreasuryActivityReport {
  string iid = 1;
  string activity_id = 2;
  string activity_hash = 3;
  string idempotency_key = 4;
  string timestamp = 5;
  string ledger_id = 6;
  string operation = 7;
  string operation_name = 8;
  string sender_account = 9;
  string caller_account = 10;
  string contract_addr = 11;
  string contract_type = 12;
  string from_account = 13;
  string to_account = 14;
  string from_vault = 15;
  string to_vault = 16;
  string from_reserve_id = 17;
  string to_reserve_id = 18;
  string from_stash = 19;
  string to_stash = 20;
  string token_id = 21;
  string amount = 22;
  string data = 23;
  string deployment_iid = 24;
  string mechanism_iid = 25;
  string legal_structure_iid = 26;
  string trezor_slot_address = 27;
  string exec_runtime_name = 28;
  string created_at = 29;
}

message GetTreasuryActivitiesResponse {
  string ref_execution_id = 1;                                          // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2; // REQUIRED: Pagination information
  repeated TreasuryActivityReport activities = 3;                       // REQUIRED: List of treasury activities (can be empty)

  map<string, string> metadata = 105;                                   // OPTIONAL: Response metadata
}

// ============================================================================
// Agora Events (raw on-chain AgoraEngine EventStore events)
// ============================================================================

message GetAgoraEventsRequest {
  string proposed_execution_id = 1;                                     // OPTIONAL: Client-proposed execution ID for tracking
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;    // REQUIRED: Pagination parameters

  // Optional filters
  string event_type = 3;                                                // OPTIONAL: Filter by event_type (numeric, e.g. "11"=ORDER_FILL)
  string order_id = 4;                                                  // OPTIONAL: Filter by order_id
  string trade_id = 5;                                                  // OPTIONAL: Filter by trade_id
  string deployment_iid = 6;                                            // OPTIONAL: Filter by deployment_iid

  // Time range filters
  string from_ts = 10;                                                  // OPTIONAL: Lower bound on timestamp
  string to_ts = 11;                                                    // OPTIONAL: Upper bound on timestamp

  // Sorting
  string sort_direction = 13;                                           // OPTIONAL: "asc" or "desc" (default: "desc")

  map<string, string> aux_data = 105;                                   // OPTIONAL: Additional request data
}

message AgoraEvent {
  string iid = 1;
  string event_hash = 2;
  string event_id = 3;
  string timestamp = 4;
  string pair_id = 5;
  int32  event_type = 6;
  string event_type_name = 7;
  string order_id = 8;
  string other_order_id = 9;
  string trade_id = 10;
  string quantity = 11;
  string error_code = 12;
  string reason = 13;
  string quote_balance = 14;
  string data = 15;
  string engine_addr = 16;
  string deployment_iid = 17;
  string created_at = 18;
}

message GetAgoraEventsResponse {
  string ref_execution_id = 1;                                          // REQUIRED: Reference to the execution ID
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2; // REQUIRED: Pagination information
  repeated AgoraEvent agora_events = 3;                                 // REQUIRED: List of agora events (can be empty)

  map<string, string> metadata = 105;                                   // OPTIONAL: Response metadata
}

// ============================================================================
// Saga Watch
// ============================================================================

// --- Saga Instance ---

message SagaInstance {
  string instance_id = 1;
  string cluster_id = 2;
  string zone_id = 3;
  string trace_id = 4;
  string execution_id = 5;
  string saga_submitter_id = 6;
  string state = 7;                                                     // SagaStateEnum value (e.g. SAGA_STATE_ENUM_RUNNING)
  string saga_template_id = 8;
  string input_data = 9;                                                // JSON-encoded saga input map
  map<string, string> labels = 10;
  repeated string tags = 11;
  string metadata = 12;                                                 // JSON-encoded metadata map
  repeated string child_saga_instance_ids = 13;                         // Direct child saga IDs
  string idempotent_key = 14;
  int64 created_at = 15;                                                // Unix millis
  int64 updated_at = 16;                                                // Unix millis
  // Sub-saga hierarchy
  string parent_saga_instance_id = 20;                                  // Empty for root sagas
  string parent_saga_step_instance_id = 21;                             // Step that spawned this sub-saga
  string root_saga_instance_id = 22;                                    // Root ancestor saga ID
  int32 saga_depth = 23;                                                // 0 = root, 1 = child, 2 = grandchild, etc.
  string compensation_reason = 24;                                      // Human-readable reason why compensation was triggered
}

// --- Saga Step Instance ---

message SagaStepExecutionLog {
  int64 next_execution_ts = 1;                                          // Scheduled execution time (Unix millis)
  int64 execution_request_sent_ts = 2;                                  // When execution request was sent
  int64 execution_timeout_ts = 3;                                       // Timeout deadline
  int64 execution_result_received_ts = 4;                               // When result was received
  int64 log_conclusion_ts = 5;                                          // When log entry was concluded
  string execution_result = 6;                                          // JSON-encoded result map
  string execution_error = 7;                                           // Error message (empty on success)
  bool is_compensation = 8;                                             // true if this is a compensation execution
  string metadata = 9;                                                  // JSON-encoded metadata
}

message SagaStepInstance {
  string instance_id = 1;
  string saga_instance_id = 2;
  string cluster_id = 3;
  string zone_id = 4;
  string trace_id = 5;
  string execution_id = 6;
  string state = 7;                                                     // SagaStepStateEnum value
  string affinity = 8;                                                  // Coordinator affinity group
  string saga_template_id = 9;
  string saga_step_template_id = 10;                                    // Step name/template within the saga
  string result_data = 11;                                              // JSON-encoded step result map
  string compensation_result_data = 22;                                 // JSON-encoded compensation result map
  repeated SagaStepExecutionLog execution_history = 12;                 // Full execution attempt history
  string execution_error = 13;                                          // First error from execution history
  map<string, string> labels = 14;
  repeated string tags = 15;
  string metadata = 16;                                                 // JSON-encoded metadata
  string previous_saga_step_instance_id = 17;                           // Linked list: previous step
  string next_saga_step_instance_id = 18;                               // Linked list: next step
  string idempotent_key = 19;
  int64 created_at = 20;                                                // Unix millis
  int64 updated_at = 21;                                                // Unix millis
}

// --- Step Summary ---

message SagaStepSummary {
  int32 total = 1;
  int32 completed = 2;
  int32 pending = 3;
  int32 failed = 4;
  map<string, int32> by_state = 5;                                      // Count of steps in each state
}

// --- Saga Detail (instance + steps + summary + children) ---

message SagaDetail {
  SagaInstance saga = 1;
  repeated SagaStepInstance steps = 2;                                  // Steps in execution order
  SagaStepSummary step_summary = 3;
  repeated SagaDetail child_sagas = 4;                                  // Recursive child saga details
}

// --- List Sagas ---

message ListSagasRequest {
  string proposed_execution_id = 1;                                     // OPTIONAL: Tracking ID
  tech.qomet.agora.api.grpc.common.PaginationParams pagination = 2;    // OPTIONAL: Pagination

  // Filters
  string state = 3;                                                     // OPTIONAL: Filter by saga state
  string saga_template_id = 4;                                          // OPTIONAL: Filter by saga template
  string saga_submitter_id = 5;                                         // OPTIONAL: Filter by submitter

  map<string, string> aux_data = 105;
}

message ListSagasResponse {
  string ref_execution_id = 1;
  tech.qomet.agora.api.grpc.common.PaginationInfo pagination_info = 2;
  repeated SagaInstance sagas = 3;

  map<string, string> metadata = 105;
}

// --- Get Saga ---

message GetSagaRequest {
  string proposed_execution_id = 1;
  string saga_instance_id = 2;                                          // REQUIRED: Saga instance ID

  map<string, string> aux_data = 105;
}

message GetSagaResponse {
  string ref_execution_id = 1;
  SagaDetail saga = 2;                                                  // Full saga detail with steps and summary

  map<string, string> metadata = 105;
}

// --- Get Saga Tree ---

message GetSagaTreeRequest {
  string proposed_execution_id = 1;
  string saga_instance_id = 2;                                          // REQUIRED: Root saga instance ID

  map<string, string> aux_data = 105;
}

message GetSagaTreeResponse {
  string ref_execution_id = 1;
  SagaDetail saga = 2;                                                  // Full recursive tree with all sub-sagas

  map<string, string> metadata = 105;
}

// --- Watch Saga ---

message WatchSagaRequest {
  string proposed_execution_id = 1;
  string saga_instance_id = 2;                                          // REQUIRED: Saga instance ID to watch
  bool include_children = 3;                                            // OPTIONAL: Also stream child saga updates
  int32 poll_interval_ms = 4;                                           // OPTIONAL: Poll interval in ms (default: 1000)

  map<string, string> aux_data = 105;
}

message SagaWatchEvent {
  string ref_execution_id = 1;
  SagaDetail saga = 2;                                                  // Current saga snapshot with steps and summary
  bool is_terminal = 3;                                                 // true when saga has reached a terminal state
  string terminal_state = 4;                                            // Terminal state value (only set when is_terminal=true)

  map<string, string> metadata = 105;
}
