  string legal_structure_iid = 2;                                                          // REQUIRED: LegalStructure internal identifier
  string issued_instrument_iid = 3;                                                        // REQUIRED: IssuedInstrument internal identifier

  repeated LegalStructureToIssuedInstrumentRelationTypeEnum relations = 4;                 // REQUIRED: Type of relation (default: ISSUER)

  tech.qomet.agora.api.grpc.common.DateTime effective_from_dt = 5;                         // OPTIONAL: Relation effective start date
  tech.qomet.agora.api.grpc.common.DateTime effective_to_dt = 6;                           // OPTIONAL: Relation effective end date
