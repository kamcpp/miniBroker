}

// ExternalLegalStructure represents an external LegalStructure from an external security depository.
// Used when importing IssuedInstruments from external sources - stored in IssuedInstrument.metadata
// with key "external_issuer_legal_structure".
message ExternalLegalStructure {
  string iid = 1;                                                                          // REQUIRED: External LegalStructure identifier
  repeated FinIdentifier identifiers = 2;                                                  // OPTIONAL: External identifiers (LEI, etc.)
  string type = 3;                                                                         // OPTIONAL: LegalStructure type (CORPORATION, PARTNERSHIP, etc.)

  // External source tracking
  string external_source_security_depository_iid = 10;                                     // REQUIRED: Source security depository IID
  string external_source_issued_instrument_id = 11;                                        // REQUIRED: External issued instrument ID

  map<string, string> display_names = 101;                                                 // OPTIONAL: Display names for localization
  map<string, string> descriptions = 102;                                                  // OPTIONAL: Descriptions for localization
  map<string, string> labels = 103;                                                        // OPTIONAL: Key-value labels
  repeated string tags = 104;                                                              // OPTIONAL: Tags for categorization
  map<string, string> metadata = 105;                                                      // OPTIONAL: Additional metadata
}
