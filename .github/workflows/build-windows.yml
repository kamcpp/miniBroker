name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest-large
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      # Install protoc and dart plugin, generate proto files
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.x'

      - name: Install protoc-gen-dart
        run: dart pub global activate protoc_plugin 21.1.2

      - name: Generate Dart proto files
        run: |
          $env:Path += ";$env:LOCALAPPDATA\Pub\Cache\bin"
          New-Item -ItemType Directory -Force -Path lib/generated/fin
          New-Item -ItemType Directory -Force -Path lib/generated/prtagent/v1
          protoc --proto_path=protos --dart_out=grpc:lib/generated protos/common.proto protos/fin/*.proto protos/prtagent/v1/*.proto
        shell: pwsh

      - run: flutter build windows --release

      # Upload as artifact (available on every build)
      - uses: actions/upload-artifact@v4
        with:
          name: mini-broker-windows
          path: build/windows/x64/runner/Release/

      # Create GitHub Release when a version tag is pushed
      - if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mini-broker-windows.zip
        shell: pwsh

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mini-broker-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
