name: Build Windows

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      # Upload as artifact (available on every build)
      - uses: actions/upload-artifact@v4
        with:
          name: mini-broker-windows
          path: build/windows/x64/runner/Release/

      # Create GitHub Release when a version tag is pushed
      - if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mini-broker-windows.zip
        shell: pwsh

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mini-broker-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
